<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>門市報表製作</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="eyebrow">STORE REPORT GENERATOR</div>
      <h1>門市報表製作</h1>
    </header>

    <section class="card" id="configCard">
      <h2>設定</h2>
      <div class="form-row">
        <label for="shopId">門市</label>
        <select id="shopId"></select>
      </div>
      <div class="form-row">
        <label for="weekEnd">週結束日期（週六）</label>
        <input type="date" id="weekEnd">
      </div>
      <p class="hint" id="weekRangeHint"></p>
      <div class="form-row">
        <label for="yoyEnd">年對年截止日（10/11 頁）</label>
        <input type="date" id="yoyEnd">
      </div>
      <p class="hint" id="yoyRangeHint">留空則沿用週結束日</p>
      <div class="form-row">
        <label for="empCount">編制人數</label>
        <input type="number" id="empCount" min="0" step="1" placeholder="例如 8">
      </div>
      <p class="hint" id="empCountHint">用於人均產值（總營業額 / 編制人數）。會記住上次輸入。</p>
      <div class="actions">
        <button class="primary-btn" id="generateBtn" type="button">產生報表</button>
      </div>
    </section>

    <section class="card" id="shoppertrakCard">
      <h2>來客數設定（ShopperTrak）</h2>
      <p class="hint">帳密只儲存在本機，用於 Sheet 2／10 的來客數與提袋率。未設定則自動略過來客數。</p>
      <div class="form-row">
        <label for="stUser">帳號</label>
        <input type="text" id="stUser" autocomplete="username" placeholder="ShopperTrak 帳號">
      </div>
      <div class="form-row">
        <label for="stPass">密碼</label>
        <input type="password" id="stPass" autocomplete="current-password" placeholder="ShopperTrak 密碼">
      </div>
      <div class="actions">
        <button class="primary-btn" id="stSaveBtn" type="button">儲存帳密</button>
        <button class="ghost-btn" id="stClearBtn" type="button">清除</button>
      </div>
      <p class="hint" id="stStatus"></p>
    </section>

    <section class="card" id="progressCard" hidden>
      <h2>產生進度</h2>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar" style="width:0%"></div>
      </div>
      <p class="progress-label" id="progressLabel">準備中…</p>
      <div class="log-box" id="logBox"></div>
    </section>

    <section class="card" id="downloadCard" hidden>
      <h2>下載</h2>
      <p id="downloadInfo"></p>
      <button class="primary-btn" id="downloadBtn" type="button">下載 Excel</button>
      <button class="ghost-btn" id="resetBtn" type="button">重新產生</button>
    </section>

    <section class="card" id="errorCard" hidden>
      <h2>發生錯誤</h2>
      <p id="errorMsg" class="error-msg"></p>
      <button class="ghost-btn" id="retryBtn" type="button">重試</button>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
